name: Temporary QA 213 pinned Prettier output
on:
  pull_request:
    branches:
      - qa/f1-197-409-response-body-20261116
permissions:
  contents: read
jobs:
  qa-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit exact integration file formatting
        run: |
          echo QA213_FORMAT_START
          pnpm exec prettier apps/api/test/booking-http.integration.test.ts | base64 -w0
          echo
          echo QA213_FORMAT_END
