name: Temporary Appearance codec lock resolution
on:
  push:
    branches: [chore/appearance-codec-lock-probe-20261117]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - name: Resolve pinned native codec lock only
        run: |
          pnpm add -w --save-exact --lockfile-only --ignore-scripts sharp@0.35.5
          echo '=== LOCK DIFF BEGIN ==='
          git --no-pager diff --no-ext-diff -- package.json pnpm-lock.yaml
          echo '=== LOCK DIFF END ==='
