name: F1 quality gates

on:
  pull_request:
  push:
    branches:
      - feature/f1-bootstrap-20261114

permissions:
  contents: write

jobs:
  build-and-test:
    name: Types, lint, unit, PostgreSQL integration, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cookie_ci
          POSTGRES_PASSWORD: cookie_ci
          POSTGRES_DB: cookie_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookie_ci -d cookie_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cookie_ci:cookie_ci@127.0.0.1:5432/cookie_ci
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install pinned direct dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate shadcn-svelte registry components (temporary setup step)
        if: ${{ github.head_ref == 'feature/frontend-ui-system-20261115' }}
        run: |
          pnpm --filter @cookie/web add -D tailwindcss@4.1.17 @tailwindcss/vite@4.1.17
          touch apps/web/src/ui-theme.css
          pnpm dlx shadcn-svelte@1.7.2 init --preset a2r6bw --cwd apps/web --base-color neutral --css src/ui-theme.css --components-alias '$lib/components' --lib-alias '$lib' --utils-alias '$lib/utils' --hooks-alias '$lib/hooks' --ui-alias '$lib/components/ui' --skip-preflight
          node -e "const fs=require('node:fs'); const p='apps/web/components.json'; const cfg=JSON.parse(fs.readFileSync(p)); cfg.iconLibrary='lucide'; fs.writeFileSync(p,JSON.stringify(cfg,null,2));"
          pnpm dlx shadcn-svelte@1.7.2 add --cwd apps/web --yes --skip-preflight button card input badge separator label dialog
          pnpm --filter @cookie/web add cn @lucide/svelte
          tar -czf /tmp/cookie-ui-kit.tgz apps/web/src/lib/components apps/web/src/lib/utils.ts apps/web/src/ui-theme.css apps/web/components.json apps/web/package.json pnpm-lock.yaml
          cp /tmp/cookie-ui-kit.tgz cookie-ui-kit.tgz
          git config user.name 'cookie-ui-bot'
          git config user.email 'cookie-ui-bot@users.noreply.github.com'
          git add apps/web/src/lib/components apps/web/src/lib/utils.ts apps/web/src/ui-theme.css apps/web/components.json apps/web/package.json pnpm-lock.yaml
          git commit -m 'chore(web): vendor versioned shadcn-svelte components and lock dependencies'
          git push origin HEAD:feature/frontend-ui-system-20261115
      - name: Upload generated kit for curated commit
        if: ${{ github.head_ref == 'feature/frontend-ui-system-20261115' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cookie-generated-ui-kit
          path: cookie-ui-kit.tgz
          if-no-files-found: warn
          retention-days: 1
      - name: Lint
        run: pnpm lint
      - name: Check source formatting
        run: pnpm format:check
      - name: Check kernel and contract module boundaries
        run: pnpm check:boundaries
      - name: Typecheck API and shared contracts
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL migration integration
        run: pnpm test:integration
      - name: Synthetic PostgreSQL 16 backup and restore smoke
        run: bash scripts/ci-restore-smoke.sh
      - name: Build API and migration CLI
        run: pnpm build
      - name: Synthetic worker process launch and SIGTERM smoke
        run: |
          COOKIE_SYNTHETIC_WORKER=enabled DATABASE_URL="$TEST_DATABASE_URL" node --import tsx apps/api/src/synthetic-worker-main.ts &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true' EXIT
          sleep 1
          kill -TERM "$worker_pid"
          wait "$worker_pid"
      - name: Check and build Svelte static app
        run: |
          pnpm --filter @cookie/web check
          pnpm --filter @cookie/web build
      - name: Synthetic browser onboarding and booking smoke
        run: node apps/web/scripts/browser-smoke.mjs
      - name: Attach synthetic visual evidence for review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cookie-frontend-visual-smoke
          path: apps/web/artifacts/visual-smoke/
          if-no-files-found: ignore
          retention-days: 7
