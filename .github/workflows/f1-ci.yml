name: F1 quality gates

on:
  pull_request:
  push:
    branches:
      - main

# Superseded PR runs should not consume minutes or appear as current evidence.
# The release branch must always complete its post-merge verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Types, lint, unit, PostgreSQL integration, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cookie_ci
          POSTGRES_PASSWORD: cookie_ci
          POSTGRES_DB: cookie_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookie_ci -d cookie_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cookie_ci:cookie_ci@127.0.0.1:5432/cookie_ci
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned direct dependencies
        run: bash scripts/ci/f1-gates.sh install
      - name: Review-only formatter snapshot for branch source repair
        run: |
          pnpm exec prettier --write --end-of-line auto apps/api/src/staging-owner-calendar-reschedule-http.ts apps/api/test/staging-owner-calendar-reschedule.unit.test.ts apps/web/src/lib/staging-customer-reschedule-api.ts apps/web/src/lib/staging-owner-calendar-reschedule-api.test.ts apps/web/src/lib/staging-owner-calendar-reschedule-api.ts packages/domain-booking/src/reschedule.ts
          for file in apps/api/src/staging-owner-calendar-reschedule-http.ts apps/api/test/staging-owner-calendar-reschedule.unit.test.ts apps/web/src/lib/staging-customer-reschedule-api.ts apps/web/src/lib/staging-owner-calendar-reschedule-api.test.ts apps/web/src/lib/staging-owner-calendar-reschedule-api.ts packages/domain-booking/src/reschedule.ts; do
            printf 'KUKI_FORMAT_START:%s:' "$file"
            base64 -w0 "$file"
            printf ':KUKI_FORMAT_END\n'
          done
          exit 1
      - name: Lint
        run: bash scripts/ci/f1-gates.sh lint
      - name: Check source formatting
        run: bash scripts/ci/f1-gates.sh format_check
      - name: Check kernel and contract module boundaries
        run: bash scripts/ci/f1-gates.sh boundaries
      - name: Check frontend UI module boundaries
        run: bash scripts/ci/f1-gates.sh ui
      - name: Typecheck API and shared contracts
        run: bash scripts/ci/f1-gates.sh types
      - name: Unit tests
        run: bash scripts/ci/f1-gates.sh unit
      - name: PostgreSQL migration integration
        run: bash scripts/ci/f1-gates.sh integration
      - name: Synthetic PostgreSQL 16 backup and restore smoke
        run: bash scripts/ci/f1-gates.sh restore
      - name: Build API and migration CLI
        run: bash scripts/ci/f1-gates.sh build
      - name: Compiled synthetic worker fail-closed and SIGTERM smoke
        run: bash scripts/ci/f1-gates.sh worker
      - name: Check and build Svelte static app
        run: bash scripts/ci/f1-gates.sh web
      - name: Synthetic browser onboarding and booking smoke
        id: browser_smoke
        run: bash scripts/ci/f1-gates.sh browser
      - name: Validate synthetic browser evidence completeness
        run: bash scripts/ci/f1-gates.sh browser_evidence
      - name: Attach synthetic visual evidence for review
        if: ${{ always() && steps.browser_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cookie-frontend-visual-smoke
          path: apps/web/artifacts/visual-smoke/
          if-no-files-found: error
          retention-days: 7
      # Actual compiled API-mode + disposable PostgreSQL, separate from mock evidence.
      - name: Real owner browser E2E with PostgreSQL (synthetic signed proof)
        id: real_owner_browser
        run: bash scripts/ci/f1-gates.sh real_owner
      - name: Report exact commit and smoke result
        if: ${{ always() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          BROWSER_SMOKE_RESULT: ${{ steps.browser_smoke.outcome }}
          REAL_OWNER_BROWSER_RESULT: ${{ steps.real_owner_browser.outcome }}
        run: |
          {
            echo '### F1 CI evidence'
            echo "Source head: \`$PR_HEAD_SHA\`"
            echo "Workflow tested: \`$TESTED_SHA\`"
            echo "Browser smoke: \`$BROWSER_SMOKE_RESULT\`"
            echo "Real owner browser smoke: \`$REAL_OWNER_BROWSER_RESULT\`"
            echo 'Includes lint, formatting, boundaries, API/web tests, migrations, synthetic restore, build and browser checks.'
          } >> "$GITHUB_STEP_SUMMARY"

  staging-runtime:
    name: Compiled staging Compose / persistent PostgreSQL / fail-closed web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject falsely green readiness checks (Issue #214)
        run: bash scripts/ci/f1-gates.sh staging_readiness
      - name: Build and smoke real compiled application stack
        run: bash scripts/ci/f1-gates.sh staging_runtime

  postgres17-compatibility:
    name: PostgreSQL 17 migration and transaction compatibility (Altare)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cookie_ci
          POSTGRES_PASSWORD: cookie_ci
          POSTGRES_DB: cookie_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookie_ci -d cookie_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cookie_ci:cookie_ci@127.0.0.1:5432/cookie_ci
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: bash scripts/ci/f1-gates.sh install
      - name: Verify actual PostgreSQL 17 service, not just image tag
        run: bash scripts/ci/f1-gates.sh pg17_verify
      - name: Run real PG17 migrations and integration regression
        run: bash scripts/ci/f1-gates.sh integration
      - name: Synthetic PostgreSQL 17 backup, restore and Booking replay
        run: bash scripts/ci/f1-gates.sh pg17_restore
