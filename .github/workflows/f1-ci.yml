name: Diagnostic only — exact Prettier patch
on:
  pull_request:
permissions:
  contents: read
jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - run: pnpm install --frozen-lockfile
      - name: Print exact formatter patch (never a passing F1 gate)
        run: |
          pnpm exec prettier --write apps/api/src/appearance-http.ts apps/api/test/appearance.integration.test.ts packages/domain-appearance/src/postgres.ts
          git diff -- apps/api/src/appearance-http.ts apps/api/test/appearance.integration.test.ts packages/domain-appearance/src/postgres.ts
          echo 'Diagnostic only; never merge or treat this run as F1 acceptance.'
          exit 1
