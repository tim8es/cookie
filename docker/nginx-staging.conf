server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS changes API IP on container recreate/restart.
    # Resolve at request time instead of pinning the startup address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $cookie_api_backend "api:3000";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Same-origin routing means future reviewed API clients need no browser DB URL.
    location /health/ {
        proxy_pass http://$cookie_api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /v1/ {
        proxy_pass http://$cookie_api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
