# Synthetic local development data only. Not a production deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cookie_dev
      POSTGRES_PASSWORD: cookie_dev
      POSTGRES_DB: cookie_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookie_dev -d cookie_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cookie_dev_data:/var/lib/postgresql/data

volumes:
  cookie_dev_data:
